plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cameramonitor'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.cameramonitor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildFeatures { viewBinding true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // AndroidUSBCamera UVC library (JitPack) — includes the Kotlin runtime
    implementation 'com.github.ernestp.AndroidUSBCamera:libausbc:3.6.0'
    implementation 'com.github.ernestp.AndroidUSBCamera:libuvc:3.6.0'
}
